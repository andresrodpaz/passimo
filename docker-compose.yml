# Local development infrastructure.
#
# Only PostgreSQL. The application runs on the host with `pnpm dev` so that hot
# reload, the debugger and the camera permission on http://localhost all behave
# normally — putting Next.js in a container buys nothing in development and costs
# all three. `docker compose --profile app up` is available for the occasional
# "does the production build actually work" check.
#
#   pnpm db:up        start PostgreSQL
#   pnpm db:migrate   apply the schema
#   pnpm seed:demo    load demo merchants
#   pnpm dev          run the app

services:
  postgres:
    image: postgres:16-alpine
    container_name: passimo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-passimo}
      POSTGRES_USER: ${POSTGRES_USER:-passimo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passimo}
      # Deterministic collation, so ORDER BY on customer names sorts the same way
      # locally as it does on Railway.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `pnpm db:migrate` runs the moment this reports healthy, so the check has
      # to mean "accepting queries", not "process started".
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-passimo} -d ${POSTGRES_DB:-passimo}']
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Opt-in: `docker compose --profile app up --build`
  app:
    profiles: ['app']
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Inside the compose network the database is reachable by service name, not
      # on localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-passimo}:${POSTGRES_PASSWORD:-passimo}@postgres:5432/${POSTGRES_DB:-passimo}
    restart: unless-stopped

volumes:
  postgres_data:
